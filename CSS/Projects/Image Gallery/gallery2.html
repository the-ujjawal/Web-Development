<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Gallery</title>
    <link rel="Stylesheet" href="style2.css">
</head>
<body>

    <div id="wrapper">

        <div class="container">

            <h1>Anime Gallery</h1>
            <div class="Gallery">

                <figure class="card">
                    <img src="aot.jpg" alt="Attack On Titan">
                    <figcaption>Attack On Titan</figcaption>
                </figure>

                <figure class="card">
                    <img src="naruto.webp" alt="Naruto">
                    <figcaption>Naruto</figcaption>
                </figure>

                <figure class="card">
                    <img src="one.jpg" alt="One Piece">
                    <figcaption>One Piece</figcaption>
                </figure>

                <figure class="card">
                    <img src="bleach.jpg" alt="Bleach">
                    <figcaption>Bleach</figcaption>
                </figure>

                <figure class="card">
                    <img src="black.jpg" alt="Black Clover">
                    <figcaption>Black Clover</figcaption>
                </figure>

                <figure class="card">
                    <img src="berserk.jpg" alt="Berserk">
                    <figcaption>Berserk</figcaption>
                </figure>

                <figure class="card">
                    <img src="demon.jpg" alt="Demon Slayer">
                    <figcaption>Demon Slayer</figcaption>
                </figure>

                <figure class="card">
                    <img src="jujutsu.jpg" alt="Jujutsu Kaisen">
                    <figcaption>Jujutsu Kaisen</figcaption>
                </figure>

                <figure class="card">
                    <img src="solo.png" alt="Solo Leveling">
                    <figcaption>Solo Leveling</figcaption>
                </figure>

                <figure class="card">
                    <img src="hxh.jpg" alt="Hunter X Hunter">
                    <figcaption>Hunter X Hunter</figcaption>
                </figure>

                <figure class="card">
                    <img src="code.jpg" alt="Code Geas">
                    <figcaption>Code Geas</figcaption>
                </figure>

                <figure class="card">
                    <img src="vinland.jpg" alt="Vinland">
                    <figcaption>Vinland Saga</figcaption>
                </figure>

            </div>

        </div>

    </div>
    
</body>
</html>
